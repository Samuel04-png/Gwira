<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Join Gwira</title><link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/accept.css"><script src="/accept.js" defer></script></head><body><main><img class="brand" src="/gwira-logo.png" width="52" height="47" alt="Gwira"><h1>Join Gwira</h1><p id="organization">Checking your invitation…</p><p id="details"></p><p id="status" role="status" aria-live="polite"></p><form id="email-form" hidden><label>Email address<input id="email" type="email" autocomplete="email" required></label><button>Continue with Email</button></form><form id="code-form" hidden><label>Verification code<input id="code" type="text" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label><button>Verify and continue</button></form><button id="resend" hidden>Resend code</button><button id="accept" hidden>Accept invitation</button><a id="open-desktop" hidden>Open Gwira</a><button id="change" hidden>Switch account</button><p>Your invitation is accepted only after you verify your email. Local work stays on your device.</p></main></body></html>
